name: Manter Central RH acordada

on:
  schedule:
    - cron: "17 11 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Acordar o Supabase da Central RH
        env:
          URL: ${{ secrets.RH_SUPABASE_URL }}
          KEY: ${{ secrets.RH_SUPABASE_KEY }}
        run: |
          resposta=$(curl -sS -w "\n%{http_code}" -X POST "$URL/rest/v1/rpc/rh_ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          codigo=$(echo "$resposta" | tail -n1)
          echo "Resposta: $resposta"
          if [ "$codigo" != "200" ]; then
            echo "::error::Supabase da Central RH nao respondeu (codigo $codigo)."
            exit 1
          fi
          echo "Central RH acordada!"
